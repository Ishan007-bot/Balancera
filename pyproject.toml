[project]
name = "recon-agent"
version = "0.1.0"
description = "Multi-source reconciliation agent: LLM proposes, deterministic code disposes"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The SPEC default. Only one of these is needed, and none for --no-llm.
llm = ["anthropic>=0.40"]
groq = ["openai>=1.0"]          # Groq speaks the OpenAI-compatible API
gemini = ["google-generativeai>=0.8"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
